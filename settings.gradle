pluginManagement {
    repositories {
        gradlePluginPortal()
        maven {
            name = "Fabric"
            url = "https://maven.fabricmc.net/"
        }
    }
}

plugins {
    // Lets Gradle auto-provision the JDK 25 toolchain (and the JDK 25 daemon
    // pinned in gradle/gradle-daemon-jvm.properties) from a foojay-backed
    // download service when a matching JDK is not already installed locally.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '0.9.0'
}

rootProject.name = "collins-fabric"
