#
# Gradle Daemon JVM criteria.
#
# 26.x / Loom 1.15+ require Java 25 to run, both at runtime and to build.
# Pinning the daemon to JDK 25 here means you do not have to set JAVA_HOME
# before every build - Gradle auto-detects any installed JDK 25 (any vendor;
# or point JAVA_HOME / org.gradle.java.home at one). An installed JDK 25 is
# REQUIRED: the daemon JVM is chosen before settings.gradle runs, so the
# foojay resolver there only provisions the compile toolchain, not the daemon.
#
toolchainVersion=25
