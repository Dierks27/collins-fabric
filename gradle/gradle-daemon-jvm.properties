#
# Gradle Daemon JVM criteria.
#
# 26.x / Loom 1.15+ require Java 25 to run, both at runtime and to build.
# Pinning the daemon to JDK 25 here means you do not have to set JAVA_HOME
# before every build - Gradle auto-discovers any installed JDK 25 (or
# provisions one through the foojay resolver in settings.gradle).
#
toolchainVersion=25
