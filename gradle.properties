# Done to increase the memory available to gradle.
# The Loom jar build with nested bytedeco/ffmpeg natives comfortably exceeds
# the default 512 MB, so we bump to 4 GB.
org.gradle.jvmargs=-Xmx4G
# Let Gradle discover JDKs installed by Adoptium, Microsoft, Oracle etc. in
# standard locations, and download a JDK 25 through the foojay resolver when
# none is found.
org.gradle.java.installations.auto-detect=true
org.gradle.java.installations.auto-download=true
# Fabric Properties
# 26.1+ dropped Yarn - Loom uses Mojang's official names directly (no remap).
minecraft_version=26.3
loader_version=0.20.1
# Mod Properties
mod_version=1.5.1
maven_group=org.sawiq
archives_base_name=collins-fabric
# Dependencies - see https://modrinth.com/mod/fabric-api/versions for the latest 26.3 build
fabric_version=0.165.0+26.3
modmenu_version=21.0.0
cloth_config_version=26.3.159+fabric
